# OpenSpec Config — nails-app
# Auto-generated by sdd-init phase executor
# Last updated: 2026-06-21

# ── Project Context ──────────────────────────────────────────────────────────
context: |
  Nail studio booking system (nails-app). Monorepo with frontend/ (React 18 +
  TypeScript + Vite 8) and backend/ (Python 3 + FastAPI + SQLModel + SQLite).
  SDD-documented: REQUIREMENTS.md (tech-agnostic), ARCHITECTURE.md (conceptual),
  STACK.md (tech decisions), DOCUMENTATION.md (change log), AGENTS.md (agent
  discipline). No CI config, no linter/formatter/coverage tools.

# ── Artifact Store ───────────────────────────────────────────────────────────
store:
  mode: hybrid
  engram: true
  openspec: true

# ── Strict TDD ──────────────────────────────────────────────────────────────
strict_tdd: true
strict_tdd_reason: >
  pytest 7.0+ detected for backend tests (FastAPI TestClient/httpx). Frontend
  has no test runner yet. No explicit marker found; SDD convention default
  enabled because a test runner exists.

# ── Testing Capabilities ─────────────────────────────────────────────────────
testing:
  runners:
    - framework: pytest
      command: python -m pytest
      path: backend/
      layers: [integration]
  layers:
    unit:
      available: false
      tool: null
    integration:
      available: true
      tool: "pytest + FastAPI TestClient (httpx)"
    e2e:
      available: false
      tool: null
  coverage:
    available: false
    command: null
  quality:
    linter:
      available: false
    type_checker:
      available: true
      command: tsc --noEmit
      path: frontend/
    formatter:
      available: false

# ── Phase Rules ──────────────────────────────────────────────────────────────
phases:
  proposal:
    require_context: true
    require_spec: true
  spec:
    require_approval: true
    strict_tdd_enforced: true
  design:
    require_spec: true
    require_tech_decision_log: true
  tasks:
    require_design: true
    require_complexity_estimate: true
  apply:
    require_tasks: true
    require_tests: true
  verify:
    require_coverage: false  # no coverage tool available
    run_tests: true
  archive:
    require_verify: true

# ── Review Budget ────────────────────────────────────────────────────────────
review:
  budget_lines: 400

# ── Delivery ─────────────────────────────────────────────────────────────────
delivery:
  strategy: auto-forecast
